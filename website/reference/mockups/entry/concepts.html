<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light"><title>Corporator — five entry concepts</title>
<style>
@font-face{font-family:Plex;src:url('../../../../art/fonts/ibm_plex_sans.woff2')}@font-face{font-family:Octo;src:url('../../../../website/fonts/tt-octosquares/TT-Octosquares-Trial-Condensed-Black.ttf')}
:root{--ink:#0B1236;--text:#3F4E70;--muted:#6F7D9C;--blue:#0A5CF8;--soft:#E6F0FF;--panel:#F2F7FE;--line:#D3E2F4;--strong:#B9CFEA}
*{box-sizing:border-box}body{margin:0;font-family:Plex,Arial,sans-serif;background:#80c7f3;color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:4px}button:active{transform:translateY(1px)}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}img{display:block}
.page{position:relative;min-height:100svh;overflow:hidden}.sky{position:absolute;inset:0;pointer-events:none}.sky img{width:100%;height:100%;object-fit:cover;object-position:center}.sky::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#e4f0fd18,transparent 48%)}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:30px 5.7vw}.brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;letter-spacing:.05em}.brand img{width:34px;height:36px;object-fit:contain}.back{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--ink);font-size:13px;min-height:44px}
main{position:relative;z-index:1;min-height:calc(100svh - 104px);display:flex;align-items:center;padding:20px 5.7vw 76px}.entry{width:410px;max-width:100%}.eyebrow{font-size:10px;letter-spacing:.12em;font-weight:600;text-transform:uppercase;color:var(--muted);margin:0 0 12px}.display{font-family:Octo,Plex,sans-serif;text-transform:uppercase;font-weight:900;font-size:43px;line-height:1.02;letter-spacing:.01em;margin:0}.display em{font-style:normal;color:var(--blue)}.body{font-size:13px;line-height:1.55;color:var(--text);margin:13px 0 21px}.button{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;border:1px solid var(--strong);border-radius:8px;background:#fff;color:var(--blue);padding:13px 16px;min-height:52px;font-weight:600;font-size:14px;transition:background 160ms,box-shadow 160ms}.button:hover{background:var(--soft)}.button.primary{color:#fff;background:var(--blue);border:1px solid var(--blue);border-bottom:3px solid #0643BC;box-shadow:0 5px 14px #0a5cf825}.button.primary:hover{background:#0850DE;box-shadow:0 7px 18px #0a5cf833}.button .label{flex:1}.button .right{width:17px;height:17px}.link{border:0;background:none;padding:9px 0;color:var(--blue);font-size:12px;min-height:44px}.small{font-size:11px;line-height:1.6;color:var(--muted)}.network{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:#fff9;color:var(--text);font-size:10px;white-space:nowrap}.network svg{width:12px;height:12px}.secure{display:flex;align-items:center;gap:9px;font-size:11px;line-height:1.6;color:var(--text)}.secure svg{width:16px;color:var(--blue)}.bottom-help{position:absolute;bottom:19px;left:5.7vw;z-index:2;color:var(--text);background:none;border:0;font-size:11px;min-height:44px}.panel{background:rgba(242,247,254,.97);border:1px solid #b9cfea;border-radius:16px;box-shadow:0 19px 48px #0b1e5024,inset 0 1px 0 #fff;backdrop-filter:blur(8px)}
/* 1: a perforated city pass, with actions in a separate ticket stub. */
.pass{width:410px}.pass-head{padding:17px 25px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.05em}.pass-head .title{display:flex;gap:8px;align-items:center}.pass-head svg{width:17px;color:var(--blue)}.pass-main{padding:26px 25px 18px;position:relative}.pass-main .display{font-size:43px;max-width:240px}.pass-main .city{position:absolute;right:8px;top:20px;width:139px;height:162px;object-fit:contain;filter:drop-shadow(0 7px 5px #0b1e5020)}.pass-main .body{max-width:215px;margin:16px 0 18px}.pass-steps{display:flex;gap:8px;align-items:center;font-size:10px;color:var(--muted)}.pass-steps b{color:var(--blue);font-weight:600}.pass-steps i{height:1px;flex:1;background:var(--line)}.tear{position:relative;height:14px;border-top:1px dashed #acc6e9;margin-top:8px}.tear::before,.tear::after{content:'';position:absolute;top:-8px;width:15px;height:15px;border:1px solid #b9cfea;border-radius:50%;background:#bee1f8}.tear::before{left:-8px}.tear::after{right:-8px}.pass-stub{padding:12px 25px 20px}.pass-stub .primary{min-height:57px}.pass-stub .demo-link{display:block;width:100%;text-align:center;margin:4px 0 5px}.pass-stub .secure{justify-content:center;border-top:1px solid var(--line);padding-top:14px;font-size:10px}
/* 2: a centered portal with the architecture above the sign-in capsule. */
.portal{width:390px;text-align:center}.portal .display{font-size:39px}.portal .eyebrow{color:var(--blue);margin-bottom:12px}.portal-figure{position:relative;height:210px;width:240px;margin:3px auto 0;pointer-events:none}.portal-orbit{position:absolute;inset:16px 18px 10px;border:1px solid #84b2ef;border-radius:50%;background:#e6f0ff83;box-shadow:inset 0 0 0 12px #ffffff40}.portal-orbit::before{content:'';position:absolute;inset:17px;border:1px solid #abcaf1;border-radius:50%}.portal-floor{position:absolute;left:36px;right:36px;bottom:15px;height:29px;border:1px solid #8db5f7;background:#d8e8ff;border-radius:50%;box-shadow:0 9px 16px #0a5cf817}.portal-figure img{position:absolute;inset:0;width:240px;height:210px;object-fit:contain;filter:drop-shadow(0 9px 5px #0b1e5025)}.portal-capsule{position:relative;padding:22px 24px 17px;max-width:340px;margin:-8px auto 0;border-radius:20px}.portal-capsule .body{margin:0 0 16px;font-size:12px}.portal-capsule .link{width:100%;margin-top:3px}.portal .network{margin-top:16px}.portal .secure{justify-content:center;margin-top:8px;font-size:10px}
/* 3: two visually equal game modes, with wallet play carrying the CTA. */
.paths{width:446px}.paths-top{padding:25px 26px 17px}.paths-top .display{font-size:40px}.paths-top .body{margin:14px 0 0}.path-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 21px 19px}.path-card{display:flex;flex-direction:column;align-items:flex-start;border:1px solid #B9CFEA;border-radius:10px;background:#fff;padding:18px 15px 14px;min-height:247px}.path-card.play{border-color:var(--blue);background:var(--soft);box-shadow:inset 0 3px 0 var(--blue)}.path-icon{width:42px;height:42px;border-radius:9px;border:1px solid #c2d8fb;display:grid;place-items:center;color:var(--blue);background:#fff;margin-bottom:21px}.path-card h2{font-size:19px;line-height:1.15;margin:0 0 10px;font-weight:700;letter-spacing:-.02em}.path-card p{font-size:11px;line-height:1.6;color:var(--text);margin:0 0 19px}.path-card .button{margin-top:auto;font-size:11px;min-height:45px;padding:10px 8px;border-radius:6px;gap:5px}.paths-foot{padding:13px 24px 16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:9px}.paths-foot .small{font-size:10px}.paths-foot svg{width:15px;color:var(--blue)}
/* 4: a blue command-deck header and a lineup of original game objects. */
.deck{width:426px;overflow:hidden}.deck-bar{background:var(--blue);color:white;height:53px;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.deck-bar strong{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.07em}.deck-bar svg{width:17px}.deck-bar .network{border-color:#ffffff35;background:#ffffff18;color:#fff;font-size:9px}.deck-body{padding:23px 25px 22px}.deck .display{font-size:37px}.deck-body .body{margin-top:12px;margin-bottom:6px}.deck-city{position:relative;height:123px;display:flex;align-items:flex-end;justify-content:center;gap:0;margin:0 0 12px;border-bottom:1px solid #cadcf7;background:#E6F0FF;border-radius:9px}.deck-city img{position:relative;z-index:1;object-fit:contain;filter:drop-shadow(0 6px 4px #0b1e5019)}.deck-city img:nth-child(1){width:100px;height:88px;margin-bottom:8px}.deck-city img:nth-child(2){width:98px;height:123px;margin-bottom:1px}.deck-city img:nth-child(3){width:108px;height:84px;margin-bottom:9px}.deck-procedure{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:11px 0 16px;margin-bottom:18px}.deck-procedure b{width:25px;height:25px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:6px;font-size:11px}.deck-procedure strong{font-size:12px}.deck-procedure span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.deck-actions{display:grid;grid-template-columns:1fr 99px;gap:9px}.deck-actions .button{font-size:12px;padding-inline:10px;min-height:51px}.deck .secure{margin-top:16px;font-size:10px}
/* 5: a title screen with a wide bottom play dock instead of a vertical form. */
.dock-title{width:405px;align-self:flex-start;margin-top:39px}.dock-title .eyebrow{color:var(--blue)}.dock-title .display{font-size:58px;line-height:1.03}.dock-title .body{max-width:300px;margin-top:19px;font-size:14px}.dock-stage main{padding-bottom:226px}.launch-dock{position:absolute;z-index:2;left:5.7vw;right:5.7vw;bottom:54px;display:flex;align-items:center;gap:28px;padding:22px 25px;border-radius:14px;background:rgba(242,247,254,.97);border:1px solid #B9CFEA;box-shadow:0 14px 40px #0b1e5026;backdrop-filter:blur(8px)}.dock-icon{display:grid;place-items:center;flex-shrink:0;width:55px;height:55px;border-radius:11px;border:1px solid #b9d3fb;background:var(--soft);color:var(--blue)}.dock-icon svg{width:29px;height:29px}.dock-copy{flex:1}.dock-copy h2{font-size:18px;margin:0 0 6px}.dock-copy p{font-size:11px;color:var(--text);margin:0}.dock-cta{width:244px;flex-shrink:0}.dock-demo{width:139px;flex-shrink:0}.dock-stage .bottom-help{bottom:1px}.dock-badge{margin-top:6px;display:inline-flex;align-items:center;gap:7px;color:var(--text);font-size:11px}.dock-badge svg{width:14px;color:var(--blue)}
.review{margin:16px auto 20px;width:max-content;max-width:calc(100% - 24px);display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:10px;border:1px solid #D3E2F4;background:#F2F7FE;border-radius:12px}.review button{border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text);padding:9px 13px;min-height:38px;font-size:12px}.review button[aria-pressed="true"]{background:var(--blue);color:white;border-color:var(--blue)}.review .export{color:var(--blue)}
dialog{width:calc(100% - 32px);max-width:420px;padding:26px;border:1px solid var(--strong);border-radius:14px;background:var(--panel);color:var(--ink);box-shadow:0 24px 60px #0b12363d}dialog::backdrop{background:#0b123655}dialog h2{font-size:23px;line-height:1.2;margin:0 0 16px}dialog p{font-size:13px;line-height:1.6;color:var(--text)}dialog label{font-size:12px}dialog input,dialog textarea{display:block;width:100%;margin:8px 0 16px;padding:10px;border:1px solid var(--strong);border-radius:6px}dialog textarea{height:110px}.modal-actions{display:grid;gap:8px;margin-top:20px}
@media(min-width:1600px){main{padding-left:8vw}.entry{transform:scale(1.07);transform-origin:left center}}
@media(max-width:1060px) and (min-width:761px){header{padding-inline:32px}main{padding-inline:32px}.entry{width:386px}.paths{width:426px}.paths-top .display{font-size:37px}.bottom-help{left:32px}.dock-title .display{font-size:48px}.launch-dock{left:32px;right:32px;gap:17px;padding:18px}.dock-cta{width:200px}.dock-demo{width:116px}.dock-icon{display:none}}
@media(max-width:760px){header{padding:20px 20px 0;min-height:66px}.brand{font-size:16px;gap:8px}.brand img{width:26px;height:29px}.back{font-size:11px;gap:5px}.back svg{width:15px}.sky{inset:0 0 auto;height:378px}.sky img{position:absolute;width:auto;height:320px;top:56px;right:0;object-fit:contain;mask-image:linear-gradient(180deg,transparent,#000 10%,#000 65%,transparent)}main{padding:229px 16px 104px;min-height:auto;align-items:flex-start;justify-content:center}.entry{width:410px}.bottom-help{position:relative;display:block;bottom:auto;left:auto;margin:-70px auto 20px}.pass-head{padding:16px 20px}.pass-main{padding:23px 20px 17px}.pass-main .display{font-size:39px;max-width:215px}.pass-main .city{right:-5px;width:123px;height:154px;top:17px}.pass-main .body{max-width:190px;font-size:12px}.pass-stub{padding:10px 20px 20px}.pass-steps{font-size:9px}.portal .display{font-size:35px}.portal-capsule{max-width:100%}.portal-figure{height:197px}.portal-figure img{height:199px}.portal-orbit{bottom:4px}.paths-top{padding:24px 21px 18px}.paths-top .display{font-size:36px}.path-grid{padding:0 16px 17px;gap:9px}.path-card{padding:16px 12px 13px;min-height:242px}.path-card h2{font-size:17px}.path-card p{font-size:10px}.path-card .button{font-size:10px}.paths-foot{padding:13px 18px;flex-wrap:wrap;gap:6px}.deck-bar{padding-inline:20px}.deck-body{padding:22px 20px}.deck .display{font-size:34px}.deck-city img:nth-child(1){width:88px}.deck-city img:nth-child(2){width:87px}.deck-city img:nth-child(3){width:93px}.dock-stage main{padding-bottom:26px}.dock-title{margin-top:0}.dock-title .display{font-size:49px}.dock-title .body{font-size:13px}.launch-dock{position:relative;left:auto;right:auto;bottom:auto;margin:0 16px 96px;display:grid;grid-template-columns:1fr 108px;padding:21px;gap:13px}.dock-icon{display:none}.dock-copy{grid-column:1/-1;margin-bottom:6px}.dock-cta,.dock-demo{width:100%;font-size:12px;padding-inline:10px}.dock-stage .bottom-help{bottom:auto;margin:-72px auto 20px}.review{max-width:calc(100% - 24px);width:calc(100% - 24px)}.review button{font-size:11px;padding:8px 9px}}
@media(max-width:380px){.pass-main .display{font-size:35px}.pass-main .city{width:111px;right:-11px}.pass-main .body{max-width:170px}.pass-head{padding-inline:17px}.pass-head .network{font-size:9px;padding-inline:6px}.paths-top .display{font-size:32px}.path-card{padding-inline:10px}.path-card h2{font-size:16px}.path-card .button{font-size:9px}.deck .display{font-size:31px}.deck-bar{padding-inline:17px}.deck-bar strong{font-size:10px}.dock-title .display{font-size:45px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="page" id="page"><div class="sky" aria-hidden="true"><img src="entry-island-render-v1.png" alt="" width="1672" height="941" fetchpriority="high"></div><header><div class="brand"><img src="../../../../apps/client/assets/hud/brand/mark.png" alt="" width="34" height="36"><span>CORPORATOR</span></div><button class="back" data-action="back"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 5-7 7 7 7M5 12h14"/></svg>Back to site</button></header><main id="main"></main><div id="dock"></div><button class="bottom-help" data-action="help">Need help getting in?</button></div>
<nav class="review" aria-label="Choose mockup concept"><button data-concept="1">1 · City Pass</button><button data-concept="2">2 · Portal</button><button data-concept="3">3 · Play Modes</button><button data-concept="4">4 · Command Deck</button><button data-concept="5">5 · Launch Dock</button></nav>
<dialog id="flow-dialog" aria-labelledby="flow-title"><h2 id="flow-title"></h2><p id="flow-copy"></p><div class="modal-actions"><button class="button primary" id="flow-continue">Continue preview</button><button class="button" id="flow-close">Back to mockup</button></div></dialog>
<dialog id="capture-dialog" aria-labelledby="capture-title"><h2 id="capture-title">Export review capture</h2><form id="capture-form"><label>Capture filename<input id="capture-name" aria-label="Capture filename" value="concept.jpg"></label><label>Screenshot JPEG data<textarea id="capture-data" aria-label="Screenshot JPEG data"></textarea></label><button class="button primary" type="submit">Download capture</button></form></dialog>
<script>
const icons={wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M4 6V5a2 2 0 0 1 2-2h12v3M16 12h5v5h-5a2.5 2.5 0 0 1 0-5Z"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',shield:'<path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/>',city:'<path d="M4 21V9h6V3h6v10h4v8H4Zm6 0V9m6 12v-8M7 12v1m0 3v1m6-11v1m0 3v1m0 3v1m0 3v1"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5 5-3Z"/>',sign:'<path d="m4 20 4-1 12-12a2 2 0 0 0-4-4L4 15l-1 5Zm10-15 4 4M12 21h9"/>'};
const svg=(name,cls='')=>'<svg aria-hidden="true" class="'+cls+'" viewBox="0 0 24 24">'+icons[name]+'</svg>';
const building=(name,cls='',width=140,height=160)=>'<img class="'+cls+'" src="../../../../apps/client/assets/hud/buildings/'+name+'.png" alt="" width="'+width+'" height="'+height+'">';
const network=()=>'<span class="network">Robinhood Chain</span>';
const connect=(text='Connect wallet')=>'<button class="button primary" data-action="connect">'+svg('wallet')+'<span class="label">'+text+'</span>'+svg('arrow','right')+'</button>';
const demo=(text='Try demo')=>'<button class="button" data-action="demo">'+text+'</button>';
const secure=(text='Sign a message. No transaction.')=>'<div class="secure">'+svg('shield')+'<span>'+text+'</span></div>';
const templates={
1:()=>'<section class="entry panel pass" aria-label="City Pass concept"><div class="pass-head"><span class="title">'+svg('city')+'CITY PASS</span>'+network()+'</div><div class="pass-main"><p class="eyebrow">Your way into Corporator</p><h1 class="display">YOUR CITY<br><em>AWAITS.</em></h1>'+building('city_hall','city')+'<p class="body">Connect your wallet.<br>Step into your city.</p><div class="pass-steps"><b>01 · CONNECT</b><i></i><span>02 · SIGN IN</span><i></i><span>PLAY</span></div></div><div class="tear" aria-hidden="true"></div><div class="pass-stub">'+connect()+'<button class="link demo-link" data-action="demo">Explore the demo instead →</button>'+secure()+'</div></section>',
2:()=>'<section class="entry portal" aria-label="Portal concept"><p class="eyebrow">Welcome to Corporator</p><h1 class="display">ENTER <em>YOUR CITY.</em></h1><div class="portal-figure" aria-hidden="true"><span class="portal-orbit"></span><span class="portal-floor"></span>'+building('city_hall')+'</div><div class="panel portal-capsule"><p class="body">Your wallet is your way in.</p>'+connect()+'<button class="link" data-action="demo">Try the demo without a wallet →</button></div>'+network()+secure()+'</section>',
3:()=>'<section class="entry panel paths" aria-label="Play Modes concept"><div class="paths-top"><p class="eyebrow">Play Corporator</p><h1 class="display">YOUR CITY.<br><em>YOUR WAY.</em></h1><p class="body">Choose how you want to enter.</p></div><div class="path-grid"><article class="path-card play"><span class="path-icon">'+svg('wallet')+'</span><h2>Wallet play</h2><p>Connect your wallet<br>and sign in to your city.</p>'+connect()+'</article><article class="path-card"><span class="path-icon">'+svg('compass')+'</span><h2>Explore first</h2><p>Take a look around.<br>No wallet needed.</p>'+demo('Try the demo')+'</article></div><div class="paths-foot"><span class="small">'+svg('shield')+' Sign-in uses a message, not a transaction.</span>'+network()+'</div></section>',
4:()=>'<section class="entry panel deck" aria-label="Command Deck concept"><div class="deck-bar"><strong>'+svg('city')+'CITY LAUNCH</strong>'+network()+'</div><div class="deck-body"><h1 class="display">TAKE THE<br><em>CONTROLS.</em></h1><p class="body">Connect your wallet to enter Corporator.</p><div class="deck-city" aria-hidden="true">'+building('agent_hub','',100,88)+building('city_hall','',98,123)+building('workshop','',108,84)+'</div><div class="deck-procedure"><b>1</b><div><strong>Connect your wallet</strong><span>Then sign a message to enter the game.</span></div></div><div class="deck-actions">'+connect()+demo()+'</div>'+secure()+'</div></section>',
5:()=>'<section class="entry dock-title" aria-label="Launch Dock concept"><p class="eyebrow">Corporator · City-building strategy</p><h1 class="display">READY<br>TO <em>BUILD?</em></h1><p class="body">Connect your wallet.<br>Enter your city. Run the machine.</p><span class="dock-badge">'+svg('shield')+'Sign-in does not send a transaction.</span></section>'
};
const dock=()=>'<section class="launch-dock" aria-label="Game entry actions"><span class="dock-icon">'+svg('city')+'</span><div class="dock-copy"><h2>Your city starts here.</h2><p>Connect wallet → Sign in → Play</p></div><div class="dock-cta">'+connect()+'</div><div class="dock-demo">'+demo('Try the demo')+'</div></section>';
const names={1:'City Pass',2:'Portal',3:'Play Modes',4:'Command Deck',5:'Launch Dock'};
let current=1,flow='';
function showConcept(n){current=n;document.getElementById('page').classList.toggle('dock-stage',n===5);document.getElementById('main').innerHTML=templates[n]();document.getElementById('dock').innerHTML=n===5?dock():'';document.querySelectorAll('[data-concept]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.concept)===n)));document.title='Corporator — '+names[n]+' mockup';const next=new URL(location.href);next.searchParams.set('concept',n);history.replaceState(null,'',next)}
function showFlow(mode){flow=mode;const content={connect:['Check your wallet.','Approve the connection in your wallet. This mockup simulates the step and sends no wallet request.'],sign:['Confirm sign-in.','Sign the login message in your wallet to enter the game. This is a simulated design preview.'],demo:['Opening the demo.','The demo prepares the city without asking for a wallet or signature. This preview does not launch the real game.'],load:['Opening your city.','The game prepares city data and the 3D scene, then opens the HUD automatically. This is the end of this mockup.'],help:['Getting into your city','Connect a browser wallet, then sign the login message. Signing in does not send a transaction. You can also explore the demo without a wallet.']}[mode];document.getElementById('flow-title').textContent=content[0];document.getElementById('flow-copy').textContent=content[1];document.getElementById('flow-continue').hidden=mode==='help'||mode==='load'||mode==='demo';if(!document.getElementById('flow-dialog').open)document.getElementById('flow-dialog').showModal()}
document.addEventListener('click',event=>{const concept=event.target.closest('[data-concept]');if(concept){showConcept(Number(concept.dataset.concept));window.scrollTo(0,0);return}const action=event.target.closest('[data-action]');if(action){if(action.dataset.action==='back'){showConcept(current);return}showFlow(action.dataset.action)}});
document.getElementById('flow-continue').addEventListener('click',()=>showFlow(flow==='connect'?'sign':'load'));document.getElementById('flow-close').addEventListener('click',()=>document.getElementById('flow-dialog').close());
document.getElementById('capture-form').addEventListener('submit',event=>{event.preventDefault();const data=Uint8Array.from(atob(document.getElementById('capture-data').value.trim()),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([data],{type:'image/jpeg'}));const a=document.createElement('a');a.href=url;a.download=document.getElementById('capture-name').value.replace(/[^a-zA-Z0-9_.-]/g,'');document.body.append(a);a.click();a.remove();document.getElementById('capture-dialog').close();document.getElementById('capture-data').value='';setTimeout(()=>URL.revokeObjectURL(url),10000)});
if(new URLSearchParams(location.search).has('capture')){const b=document.createElement('button');b.textContent='Export';b.className='export';b.addEventListener('click',()=>document.getElementById('capture-dialog').showModal());document.querySelector('.review').append(b)}
const initial=Number(new URLSearchParams(location.search).get('concept'));showConcept(templates[initial]?initial:1);
</script>
</body></html>
