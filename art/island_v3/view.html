<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corporator — island preview</title>
    <style>
      html,
      body,
      #host {
        margin: 0;
        height: 100%;
        background: #6fb4f0;
        font-family: system-ui, sans-serif;
      }
      #host {
        position: absolute;
        inset: 0;
        overflow: hidden;
        touch-action: none;
        cursor: grab;
      }
      #host canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hint {
        position: fixed;
        left: 16px;
        bottom: 16px;
        margin: 0;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(12, 18, 28, 0.55);
        color: #eef4fa;
        font-size: 13px;
        pointer-events: none;
      }
      [data-look-error] {
        position: fixed;
        left: 16px;
        top: 16px;
        padding: 8px 12px;
        background: #3b1020;
        color: #ffe8ee;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div
      id="host"
      data-surface="scene"
      data-look="LOOK-03-preview"
      data-mass="./runtime_terra19/island_mass.glb"
      data-buildings="./runtime_terra19/buildings/"
      data-anchor-prefix="anchor_"
    ></div>
    <p class="hint">ЛКМ — вращать · колёсико — зум</p>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
