<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Corporator units</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: sans-serif;
        display: flex;
        gap: 24px;
        justify-content: center;
        align-items: flex-end;
        min-height: 100vh;
        padding: 32px;
      }
      figure {
        margin: 0;
        text-align: center;
      }
      img {
        height: 72vh;
        width: auto;
        background: #000;
      }
      figcaption {
        margin-top: 12px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <figure>
      <img src="manager.png" alt="Manager" />
      <figcaption>Manager</figcaption>
    </figure>
    <figure>
      <img src="trader.png" alt="Trader" />
      <figcaption>Trader</figcaption>
    </figure>
    <figure>
      <img src="operator.png" alt="Operator" />
      <figcaption>Operator</figcaption>
    </figure>
  </body>
</html>
