<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Corporator — Let me show you around (тест v1)</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 28px; background: #f4f4f2; color: #21282f;
         font: 15px/1.55 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: -.01em; }
  p.sub { margin: 0 0 20px; color: #6a727a; font-size: 13px; }
  .wrap { max-width: 1120px; }
  video { width: 100%; display: block; background: #000; border-radius: 4px;
          box-shadow: 0 2px 18px rgba(0,0,0,.16); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 26px; }
  button { font: inherit; font-size: 13px; padding: 7px 13px; cursor: pointer;
           background: #fff; color: #21282f; border: 1px solid #cfd4d8;
           border-radius: 5px; }
  button:hover { border-color: #8b939a; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  figure { margin: 0; }
  figure img { width: 100%; border: 1px solid #d8dcdf; border-radius: 3px;
               background: #fff; }
  figcaption { font-size: 12px; color: #6a727a; margin-top: 5px; }
  .note { margin-top: 22px; padding: 12px 14px; background: #fff;
          border-left: 3px solid #c8a02c; font-size: 13px; color: #4a5158; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Corporator — «Let me show you around»</h1>
  <p class="sub">Тестовый тизер v1 · 32,000 с · 1920×1080 · 30 fps · 960 кадров ·
     CRF 19 · AAC 48 кГц · −15,9 LUFS / −1,7 dBTP</p>

  <video id="v" controls preload="auto" playsinline
         poster="../output/cover.png">
    <source src="../output/corporator-teaser-test-v1.mp4" type="video/mp4">
  </video>

  <div class="row">
    <button onclick="v.currentTime=0;v.play()">Сначала</button>
    <button onclick="v.pause();v.currentTime=4">Сцена 02 · 0:04</button>
    <button onclick="v.pause();v.currentTime=8">Сцена 03 · 0:08</button>
    <button onclick="v.pause();v.currentTime=13">Сцена 04 · 0:13</button>
    <button onclick="v.pause();v.currentTime=18">Сцена 05 · 0:18</button>
    <button onclick="v.pause();v.currentTime=23">Сцена 06 · 0:23</button>
    <button onclick="v.pause();v.currentTime=28">Сцена 07 · 0:28</button>
    <button onclick="v.muted=!v.muted" id="mute">Выкл. звук</button>
  </div>

  <div class="grid">
    <figure>
      <img src="../output/cover.png" alt="cover">
      <figcaption>cover.png — кадр сцены 01 (3,50 с)</figcaption>
    </figure>
    <figure>
      <img src="../output/preview-contact-sheet.png" alt="contact sheet">
      <figcaption>preview-contact-sheet.png — 7 контрольных кадров</figcaption>
    </figure>
  </div>

  <p class="note">
    Полный отчёт: <a href="../output/REVIEW.md">REVIEW.md</a> ·
    <a href="../output/AUDIO_SOURCES.md">AUDIO_SOURCES.md</a> ·
    <a href="../output/project/RENDER.md">RENDER.md</a> ·
    версия без звука: <a href="../output/corporator-teaser-test-v1-muted.mp4">muted.mp4</a>
  </p>
</div>
<script>
  var v = document.getElementById('v');
  v.addEventListener('volumechange', function () {
    document.getElementById('mute').textContent = v.muted ? 'Вкл. звук' : 'Выкл. звук';
  });
</script>
</body>
</html>
